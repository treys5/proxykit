name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG:   ${{ github.event.release.tag_name }}
          RELEASE_NAME:  ${{ github.event.release.name }}
          RELEASE_URL:   ${{ github.event.release.html_url }}
          # toJSON wraps the value in a JSON string — handles newlines, backticks, quotes safely
          RELEASE_BODY:  ${{ toJSON(github.event.release.body) }}
          REPO:          ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request, urllib.error

          tag   = os.environ.get('RELEASE_TAG',  'unknown')
          name  = os.environ.get('RELEASE_NAME', tag)
          url   = os.environ.get('RELEASE_URL',  '')
          repo  = os.environ.get('REPO', 'treys5/proxykit')

          # RELEASE_BODY is JSON-encoded by toJSON(), so decode it first
          body_raw = os.environ.get('RELEASE_BODY', '""')
          try:
              body = json.loads(body_raw)
          except Exception:
              body = body_raw.strip('"')

          # Trim to Discord embed description limit (4096 chars)
          desc = (body or '').strip()[:4000] or f'Proxy Tester {tag} is now available.'

          download_url = (
              f'https://github.com/{repo}/releases/download/'
              f'{tag}/Proxy.Tester-{tag}.zip'
          )

          payload = {
              'username': 'Proxy Tester',
              'embeds': [{
                  'title': f'🚀 Proxy Tester {tag} Released',
                  'description': desc,
                  'color': 0x818CF8,
                  'fields': [
                      {
                          'name': '⬇️ Download',
                          'value': f'[Proxy.Tester-{tag}.zip]({download_url})',
                          'inline': True,
                      },
                      {
                          'name': '📋 Release Notes',
                          'value': f'[View on GitHub]({url})',
                          'inline': True,
                      },
                  ],
                  'footer': {
                      'text': 'Proxy Tester • Auto-Updater will notify active users',
                  },
              }],
          }

          data    = json.dumps(payload).encode('utf-8')
          webhook = os.environ['DISCORD_WEBHOOK_URL'].strip()
          req     = urllib.request.Request(
              webhook,
              data=data,
              headers={'Content-Type': 'application/json'},
          )

          try:
              with urllib.request.urlopen(req) as resp:
                  print(f'Discord: HTTP {resp.status} — announcement sent!')
          except urllib.error.HTTPError as e:
              body_err = e.read().decode('utf-8', errors='replace')
              print(f'Discord error {e.code}: {body_err}')
              raise
          PYEOF
