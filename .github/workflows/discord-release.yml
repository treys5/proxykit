name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG:  ${{ github.event.release.tag_name }}
          RELEASE_NAME: ${{ github.event.release.name }}
          RELEASE_URL:  ${{ github.event.release.html_url }}
          RELEASE_BODY: ${{ github.event.release.body }}
          REPO:         ${{ github.repository }}
        run: |
          python3 << 'PYEOF'
          import os, json, urllib.request

          tag   = os.environ.get('RELEASE_TAG',  'unknown')
          name  = os.environ.get('RELEASE_NAME', tag)
          url   = os.environ.get('RELEASE_URL',  '')
          body  = os.environ.get('RELEASE_BODY', '')
          repo  = os.environ.get('REPO', 'treys5/proxykit')

          # Trim description to Discord embed limit
          desc = body.strip()[:3000] or f'Proxy Tester {tag} is now available.'

          download_url = (
              f'https://github.com/{repo}/releases/download/'
              f'{tag}/Proxy.Tester-{tag}.zip'
          )

          payload = {
              'username': 'Proxy Tester',
              'avatar_url': 'https://raw.githubusercontent.com/treys5/proxykit/main/assets/icon.png',
              'embeds': [{
                  'title': f'🚀 Proxy Tester {tag} Released',
                  'description': desc,
                  'color': 0x818CF8,
                  'fields': [
                      {
                          'name': '⬇️ Download',
                          'value': f'[Proxy.Tester-{tag}.zip]({download_url})',
                          'inline': True,
                      },
                      {
                          'name': '📋 Full Release Notes',
                          'value': f'[View on GitHub]({url})',
                          'inline': True,
                      },
                  ],
                  'footer': {
                      'text': 'Proxy Tester • Auto-Updater will notify active users'
                  },
              }],
          }

          data = json.dumps(payload).encode('utf-8')
          req  = urllib.request.Request(
              os.environ['DISCORD_WEBHOOK_URL'],
              data=data,
              headers={'Content-Type': 'application/json'},
          )
          with urllib.request.urlopen(req) as resp:
              print(f'Discord: HTTP {resp.status}')
          PYEOF
