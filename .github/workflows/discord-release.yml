name: Discord Release Announcement

on:
  release:
    types: [published]

jobs:
  announce:
    runs-on: ubuntu-latest
    steps:
      - name: Post release to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RELEASE_TAG:   ${{ github.event.release.tag_name }}
          RELEASE_NAME:  ${{ github.event.release.name }}
          RELEASE_URL:   ${{ github.event.release.html_url }}
          RELEASE_BODY:  ${{ toJSON(github.event.release.body) }}
          REPO:          ${{ github.repository }}
        run: |
          python3 - << 'PYEOF'
          import os, json, subprocess

          tag  = os.environ.get('RELEASE_TAG',  'unknown')
          name = os.environ.get('RELEASE_NAME', tag)
          url  = os.environ.get('RELEASE_URL',  '')
          repo = os.environ.get('REPO', 'treys5/proxykit')

          body_raw = os.environ.get('RELEASE_BODY', '""')
          try:
              body = json.loads(body_raw)
          except Exception:
              body = body_raw.strip('"')

          desc         = (body or '').strip()[:4000] or f'Proxy Tester {tag} is now available.'
          download_url = f'https://github.com/{repo}/releases/download/{tag}/Proxy.Tester-{tag}.zip'

          payload = {
              'username': 'Proxy Tester',
              'embeds': [{
                  'title':       f'\U0001f680 Proxy Tester {tag} Released',
                  'description': desc,
                  'color':       0x818CF8,
                  'fields': [
                      {'name': '⬇️ Download',      'value': f'[Proxy.Tester-{tag}.zip]({download_url})', 'inline': True},
                      {'name': '\U0001f4cb Release Notes',   'value': f'[View on GitHub]({url})',                 'inline': True},
                  ],
                  'footer': {'text': 'Proxy Tester • Auto-Updater will notify active users'},
              }],
          }

          # Use curl — more reliable than urllib for Discord from Actions runners
          result = subprocess.run(
              [
                  'curl', '-s', '-o', '/tmp/discord_resp.txt', '-w', '%{http_code}',
                  '-X', 'POST', os.environ['DISCORD_WEBHOOK_URL'],
                  '-H', 'Content-Type: application/json',
                  '-H', 'User-Agent: DiscordBot (https://github.com/treys5/proxykit, 1.0)',
                  '--data', json.dumps(payload),
              ],
              capture_output=True, text=True,
          )

          http_code = result.stdout.strip()
          resp_body = open('/tmp/discord_resp.txt').read()
          print(f'HTTP {http_code}: {resp_body}')

          if http_code not in ('200', '204'):
              raise SystemExit(f'Discord post failed: HTTP {http_code} — {resp_body}')

          print('Discord announcement sent successfully!')
          PYEOF
